name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Static analysis (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          # "latest" ではなく固定バージョンを指定している: golangci-lint 自身の
          # バイナリは、このリポジトリの go.mod の `go` ディレクティブ以上の
          # Go ツールチェーンでビルドされている必要があるが、"latest" が
          # それより古いビルド済みバイナリを解決してしまいチェックに落ちたため。
          # go.mod の Go バージョンを上げるときはこちらも合わせて上げること。
          version: v2.12.2

      - name: Run tests
        run: go test ./... -race

      - name: Verify OpenAPI docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/api/main.go -o /tmp/docs --parseDependency
          diff -r docs /tmp/docs
