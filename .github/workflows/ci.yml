name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Static analysis (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned instead of "latest": golangci-lint's own binary must be
          # built with a Go toolchain >= this repo's go.mod `go` directive,
          # and "latest" has resolved to older prebuilt binaries that fail
          # that check. Bump this alongside go.mod's Go version.
          version: v2.12.2

      - name: Run tests
        run: go test ./... -race

      - name: Verify OpenAPI docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/api/main.go -o /tmp/docs --parseDependency
          diff -r docs /tmp/docs
