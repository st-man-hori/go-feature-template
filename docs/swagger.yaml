basePath: /api
definitions:
  github_com_st-man-hori_go-feature-template_internal_httpx.ErrorResponse:
    properties:
      error:
        properties:
          code:
            example: not_found
            type: string
          message:
            example: Task not found
            type: string
        type: object
    type: object
  github_com_st-man-hori_go-feature-template_internal_httpx.ValidationErrorResponse:
    properties:
      errors:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      message:
        example: The given data was invalid.
        type: string
    type: object
  internal_features_task.Field-bool:
    properties:
      set:
        type: boolean
      value:
        type: boolean
    type: object
  internal_features_task.Field-string:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  internal_features_task.StoreTaskRequest:
    properties:
      description:
        type: string
      dueDate:
        type: string
      title:
        maxLength: 255
        type: string
    required:
    - title
    type: object
  internal_features_task.TaskDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_features_task.TaskResponse'
    type: object
  internal_features_task.TaskListDataResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_features_task.TaskResponse'
        type: array
    type: object
  internal_features_task.TaskResponse:
    properties:
      createdAt:
        example: "2026-07-17T00:00:00Z"
        type: string
      description:
        example: Summarize Q2 sales figures
        type: string
      dueDate:
        example: "2026-08-01"
        type: string
      id:
        example: 1
        type: integer
      isDone:
        example: false
        type: boolean
      title:
        example: Write the quarterly report
        type: string
      updatedAt:
        example: "2026-07-17T00:00:00Z"
        type: string
    type: object
  internal_features_task.UpdateTaskRequest:
    properties:
      description:
        $ref: '#/definitions/internal_features_task.Field-string'
      dueDate:
        $ref: '#/definitions/internal_features_task.Field-string'
      isDone:
        $ref: '#/definitions/internal_features_task.Field-bool'
      title:
        $ref: '#/definitions/internal_features_task.Field-string'
    type: object
info:
  contact: {}
  description: Sample CRUD API demonstrating a package-by-feature Go project, ported
    from laravel-feature-template.
  title: Go Feature Template API
  version: "1.0"
paths:
  /tasks:
    get:
      parameters:
      - description: Filter by completion status
        in: query
        name: isDone
        type: boolean
      - description: Results per page (1-100, default 15)
        in: query
        name: perPage
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_task.TaskListDataResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ValidationErrorResponse'
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Task to create
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_features_task.StoreTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_task.TaskDataResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ValidationErrorResponse'
      summary: Create a task
      tags:
      - tasks
  /tasks/{task}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: task
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ErrorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      parameters:
      - description: Task ID
        in: path
        name: task
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_task.TaskDataResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ErrorResponse'
      summary: Get a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      parameters:
      - description: Task ID
        in: path
        name: task
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_features_task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_task.TaskDataResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_st-man-hori_go-feature-template_internal_httpx.ValidationErrorResponse'
      summary: Update a task
      tags:
      - tasks
swagger: "2.0"
