version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
  settings:
    revive:
      rules:
        # このtemplateでは、コメントは「なぜ」が自明でない箇所にだけ書く方針
        # (各所のパッケージ/exported型のdocコメント参照)。exportedシンボル
        # 全部に機械的にコメントを付けることは求めない。
        - name: exported
          disabled: true
  exclusions:
    paths:
      - docs
      - tmp

formatters:
  enable:
    - gofmt
    - goimports
