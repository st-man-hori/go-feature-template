version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
  settings:
    revive:
      rules:
        # This template favors comments only where the WHY is non-obvious
        # (see doc comments on packages/exported types throughout), not a
        # mechanical comment on every exported symbol.
        - name: exported
          disabled: true
  exclusions:
    paths:
      - docs
      - tmp

formatters:
  enable:
    - gofmt
    - goimports
